name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format 22
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s 22
          sudo apt-get install -y clang-format-22

      - name: Check formatting
        run: |
          mapfile -t files < <(find src test -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' -o -name '*.cppm' \))
          clang-format-22 --dry-run --Werror -style=file "${files[@]}"

  windows:
    name: windows x86-64 clang
    needs: format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Clang 22 and Ninja
        run: |
          choco upgrade llvm --version=22.1.0 -y --no-progress --allow-downgrade
          choco install ninja -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Ensure Python is available
        id: python_check
        shell: pwsh
        run: |
          if (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
            "install=false" >> $env:GITHUB_OUTPUT
          } else {
            "install=true" >> $env:GITHUB_OUTPUT
          }

      - name: Set up Python
        if: steps.python_check.outputs.install == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBME_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        shell: pwsh
        run: .\build\bme.exe --bytes 48FFC0 --quick --seed rax=64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bme-windows
          path: build/bme.exe

  linux:
    name: debian 12 x86-64 clang
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build, test, package, and smoke test
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/src" --workdir /src debian:12 bash -lc '
            set -eux
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ca-certificates curl git ninja-build python3 python3-pip dpkg-dev build-essential lsb-release software-properties-common
            curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
            bash /tmp/llvm.sh 22
            apt-get install -y clang-22 lld-22
            python3 -m pip install --break-system-packages cmake==3.31.6
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DBME_BUILD_TESTS=ON
            cmake --build build --parallel
            ctest --test-dir build --output-on-failure
            ./build/bme --bytes 48FFC0 --quick --seed rax=64
            cpack --config build/CPackConfig.cmake -G DEB -B build/package
            cpack --config build/CPackConfig.cmake -G TGZ -B build/package
            dpkg-deb --info build/package/*.deb
            dpkg --install build/package/*.deb
            /usr/bin/bme --bytes 48FFC0 --quick --seed rax=64
            mkdir build/tar-root
            tar --extract --file build/package/*.tar.gz --strip-components=1 -C build/tar-root
            build/tar-root/bin/bme --bytes 48FFC0 --quick --seed rax=64
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bme-linux
          path: |
            build/package/*.deb
            build/package/*.tar.gz

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref, '-pre') }}
          files: release/*
